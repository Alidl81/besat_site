name: besat_site_prod

# Production-only Compose topology. The developer stack in
# docker-compose.yml remains separate, with different project/volume names
# and development settings. This file builds immutable application images,
# keeps PostgreSQL private, runs migrations/static collection as one-shot
# services, and leaves HTTPS termination to the documented host proxy.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - path: backend/docker.env
        required: true
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    # PostgreSQL is reachable only on this private Compose network.

  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: "no"
    init: true
    env_file:
      - path: backend/docker.env
        required: true
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
    depends_on:
      db:
        condition: service_healthy
    command: ["python", "manage.py", "migrate", "--noinput"]
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  collectstatic:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: "no"
    init: true
    env_file:
      - path: backend/docker.env
        required: true
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - static_data_prod:/app/staticfiles
    command: ["python", "manage.py", "collectstatic", "--noinput"]
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    env_file:
      - path: backend/docker.env
        required: true
    environment:
      # Pin production settings in Compose so an editable env file cannot
      # silently select config.settings.local and bypass fail-closed checks.
      DJANGO_SETTINGS_MODULE: config.settings.production
      # Migration and static collection are completed exactly once above.
      RUN_MIGRATIONS: "0"
      COLLECT_STATIC: "0"
      SEED_PUBLIC_DATA: "0"
    ports:
      # Only the host reverse proxy should reach the backend; it is not a
      # public listener. Use BACKEND_PORT only for local operator access.
      - "127.0.0.1:${BACKEND_PORT:-8080}:8000"
    volumes:
      - static_data_prod:/app/staticfiles
      - media_data_prod:/app/media
    depends_on:
      migrate:
        condition: service_completed_successfully
      collectstatic:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/', timeout=4)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      # These are build-time values: Next serializes them into the image.
      # Fail closed if the operator did not explicitly provide the public
      # origin or the internal backend service URL.
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?Set NEXT_PUBLIC_SITE_URL=https://besat.org before building}
        BESAT_BACKEND_API_URL: ${BESAT_BACKEND_API_URL:?Set BESAT_BACKEND_API_URL=http://backend:8000/api before building}
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-/api/backend}
    restart: unless-stopped
    init: true
    env_file:
      - path: frontend/.env.production
        required: true
    environment:
      NODE_ENV: production
    ports:
      # Nginx/Caddy on the host terminates TLS and proxies to this loopback
      # listener. It is not intended to be a public HTTP endpoint.
      - "127.0.0.1:${FRONTEND_PORT:-3080}:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  postgres_data_prod:
  static_data_prod:
  media_data_prod:
