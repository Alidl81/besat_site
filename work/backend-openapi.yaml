  /api/registration/:
    get:
      operationId: registration_retrieve
      description: |-
        GET is public info fetched on every visit to the pre-registration
        page and must not be throttled at the submission rate. POST creates a
        request through the same "registration" scope as the dedicated
        /api/registration-requests/ endpoint, closing an anon-rate-only
        amplification gap on this compatibility alias.
      summary: Get public registration information
      tags:
      - Registration
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationInfo'
          description: ''
    post:
      operationId: registration_create
      description: |-
        GET is public info fetched on every visit to the pre-registration
        page and must not be throttled at the submission rate. POST creates a
        request through the same "registration" scope as the dedicated
        /api/registration-requests/ endpoint, closing an anon-rate-only
        amplification gap on this compatibility alias.
      summary: Create public registration request (frontend-compatible alias)
      tags:
      - Registration
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrationRequestCreateRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationRequestSuccess'
          description: ''
  /api/registration-requests/:
    post:
      operationId: registration_requests_create
      summary: Create public registration request
      tags:
      - Registration
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrationRequestCreateRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationRequestSuccess'
          description: ''
