name: besat_site

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    stop_grace_period: 30s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      DJANGO_READ_DOT_ENV_FILE: "False"
      SECRET_KEY: ${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY is required}
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      SECURE_SSL_REDIRECT: ${SECURE_SSL_REDIRECT:-False}
      SECURE_HSTS_SECONDS: ${SECURE_HSTS_SECONDS:-0}
      SECURE_HSTS_INCLUDE_SUBDOMAINS: ${SECURE_HSTS_INCLUDE_SUBDOMAINS:-False}
      SECURE_HSTS_PRELOAD: ${SECURE_HSTS_PRELOAD:-False}
      ENABLE_API_DOCS: ${ENABLE_API_DOCS:-False}
      WAIT_FOR_DATABASE: "1"
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-1}
      COLLECT_STATIC: ${COLLECT_STATIC:-1}
      SEED_PUBLIC_DATA: ${SEED_PUBLIC_DATA:-0}
      ENSURE_ABOUT_CMS_PAGE: ${ENSURE_ABOUT_CMS_PAGE:-1}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-3}
      GUNICORN_THREADS: ${GUNICORN_THREADS:-2}
      GUNICORN_TIMEOUT: ${GUNICORN_TIMEOUT:-60}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - backend_static:/app/staticfiles
      - backend_media:/app/media
    networks:
      - app
      - data
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/', timeout=4)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: /api/backend
    restart: unless-stopped
    init: true
    environment:
      NEXT_PUBLIC_API_BASE_URL: /api/backend
      NEXT_SERVER_API_BASE_URL: http://backend:8000/api
      BESAT_BACKEND_API_URL: http://backend:8000/api
      USE_DJANGO_CMS_ABOUT: "true"
      DJANGO_CMS_API_BASE_URL: http://backend:8000/api/headless-cms
      DJANGO_CMS_ABOUT_LANGUAGE: fa-ir
      ABOUT_FALLBACK_API_URL: http://backend:8000/api/about/
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    networks:
      - app
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s

volumes:
  postgres_data:
  backend_static:
  backend_media:

networks:
  app:
    driver: bridge
  data:
    driver: bridge
    internal: true
