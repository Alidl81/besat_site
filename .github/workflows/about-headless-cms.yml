name: About Headless CMS

on:
  push:
    branches:
      - agent/headless-django-cms-about
  pull_request:
    paths:
      - "backend/apps/about/**"
      - "backend/config/settings/base.py"
      - "backend/config/urls.py"
      - "backend/requirements.txt"
      - "backend/entrypoint.sh"
      - "frontend/src/app/about/**"
      - "frontend/src/components/about/**"
      - "frontend/src/services/about-service.ts"
      - "frontend/tests/**/about*"
      - "frontend/playwright.about*.ts"
      - "frontend/package.json"
      - "docker-compose.yml"
      - "docs/ABOUT_HEADLESS_CMS.md"
      - ".github/workflows/about-headless-cms.yml"

permissions:
  contents: read

jobs:
  backend-about:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DJANGO_SETTINGS_MODULE: config.settings.local
      DJANGO_READ_DOT_ENV_FILE: "False"
      SECRET_KEY: ci-only-secret-key
      DEBUG: "True"
      ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      DATABASE_URL: sqlite:///ci-about.sqlite3
      CMS_CONTENT_LANGUAGE: fa-ir
      ENABLE_API_DOCS: "True"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py migrate --noinput
      - run: python manage.py ensure_about_cms_page
      - run: python manage.py test apps.about.tests apps.about.test_headless_cms --verbosity 2

  frontend-about:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run test:about:unit
      - run: npx playwright install --with-deps chromium
      - run: npm run test:about:e2e
