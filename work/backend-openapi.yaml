      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CMSAchievementWriteRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CMSAchievementWriteRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CMSAchievementWriteRequest'
        required: true
      security:
