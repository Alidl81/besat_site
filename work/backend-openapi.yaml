openapi: 3.0.3
info:
  title: Besat School Backend API
  version: 1.0.0
  description: Backend API for Besat school website.
paths:
  /api/about/:
    get:
      operationId: about_retrieve
      summary: Get public about page information
      tags:
      - About
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AboutPage'
          description: ''
  /api/achievements/:
    get:
      operationId: achievements_list
      summary: List active achievements
      parameters:
      - in: query
        name: featured
        schema:
          type: boolean
      - in: query
        name: ordering
        schema:
          type: string
      - in: query
        name: page
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: تعداد نتایج برای نمایش در هر صفحه.
        schema:
          type: integer
      - in: query
        name: search
        schema:
          type: string
      - in: query
        name: unit_id
        schema:
          type: integer
      tags:
      - Achievements
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAchievementListList'
          description: ''
  /api/achievements/{slug}/:
    get:
      operationId: achievements_retrieve
      summary: Retrieve active achievement by slug
      parameters:
      - in: path
        name: slug
        schema:
          type: string
          title: اسلاگ
        required: true
      tags:
      - Achievements
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AchievementDetail'
          description: ''
  /api/announcements/:
    get:
      operationId: announcements_list
      summary: List published announcements
      parameters:
      - in: query
        name: category
        schema:
          type: string
        description: Filter announcements by category slug.
      - in: query
        name: featured
        schema:
          type: boolean
        description: 'Filter featured announcements. Accepted values: true, false.'
      - in: query
        name: ordering
        schema:
          type: string
        description: 'Allowed: published_at, -published_at, title, -title.'
      - in: query
        name: page
        schema:
          type: integer
        description: Page number for paginated results.
      - name: page_size
        required: false
        in: query
        description: تعداد نتایج برای نمایش در هر صفحه.
        schema:
          type: integer
      - in: query
        name: scope
        schema:
          type: string
        description: 'Filter by scope. Accepted values: school, unit.'
      - in: query
        name: search
        schema:
          type: string
        description: Search in title, summary, plain content text, category title,
          and unit title.
      - in: query
        name: status
        schema:
          type: string
        description: 'Public API only returns published content. Accepted value: published.'
      - in: query
        name: unit_id
        schema:
          type: integer
        description: Required when scope=unit.
      tags:
      - Announcements
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAnnouncementListList'
          description: ''
  /api/announcements/{slug}/:
    get:
      operationId: announcements_retrieve
      summary: Retrieve published announcement by slug
      parameters:
      - in: path
        name: slug
        schema:
          type: string
          title: اسلاگ
        required: true
      tags:
      - Announcements
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnnouncementDetail'
          description: ''
  /api/announcements/categories/:
    get:
      operationId: announcements_categories_list
      summary: List active announcement categories
      parameters:
      - name: ordering
        required: false
        in: query
        description: کدام فیلد باید هنگام مرتب‌سازی نتایج استفاده شود.
        schema:
          type: string
      - name: search
        required: false
        in: query
        description: یک عبارت جستجو.
        schema:
          type: string
      tags:
      - Announcements
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AnnouncementCategoryList'
          description: ''
  /api/auth/login/:
    post:
      operationId: auth_login_create
      description: |-
        Takes a set of user credentials and returns an access and refresh JSON web
        token pair to prove the authentication of those credentials.
      summary: Login and receive JWT tokens
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          description: No response body
  /api/auth/logout/:
    post:
      operationId: auth_logout_create
      summary: Logout by blacklisting refresh token
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/auth/refresh/:
    post:
      operationId: auth_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      summary: Refresh JWT access token
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/auth/set-password/:
    post:
      operationId: auth_set_password_create
      summary: Set password using an invitation token
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetPasswordRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '204':
          description: No response body
