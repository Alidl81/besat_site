name: besat_site

services:
  db:
    image: postgres:16-alpine
    container_name: besat_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: besat_site
      POSTGRES_USER: besat_user
      POSTGRES_PASSWORD: besat_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U besat_user -d besat_site"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: besat_backend
    restart: unless-stopped
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.local
      DATABASE_URL: postgres://besat_user:besat_password@db:5432/besat_site
      SECRET_KEY: ${SECRET_KEY:-local-development-secret-key-change-me}
      DEBUG: ${DEBUG:-1}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,192.168.10.65,192.168.10.71,backend}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000,http://192.168.10.65:3000,http://192.168.10.71:3000}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000,http://192.168.10.65:3000,http://192.168.10.71:3000}
      # The Next.js BFF proxy (frontend/src/app/api/backend/[...path]/route.ts)
      # overwrites X-Forwarded-Host/-Proto for absolute media URLs, but it is
      # not an IP-trusting gateway. Keep forwarded client-IP trust disabled in
      # this direct developer topology; enable it only with a real gateway
      # that strips/overwrites the headers before Django sees them.
      TRUST_PROXY_HEADERS: "false"
      BESAT_ANON_THROTTLE_SECRET: ${BESAT_ANON_THROTTLE_SECRET:-local-anonymous-throttle-secret}
      SEED_PUBLIC_DATA: "1"
      CMS_ADMIN_USERNAME: ${CMS_ADMIN_USERNAME:-besat_admin}
      CMS_ADMIN_PASSWORD: ${CMS_ADMIN_PASSWORD:-change-me-local-dev-only}
      CMS_ADMIN_EMAIL: ${CMS_ADMIN_EMAIL:-}
      CMS_ADMIN_FULL_NAME: ${CMS_ADMIN_FULL_NAME:-مدیر سامانه}
      # Used only by `manage.py seed_dev_accounts` (run manually, never
      # auto-invoked by the entrypoint) -- development-only role accounts.
      DEV_ADMIN_PASSWORD: ${DEV_ADMIN_PASSWORD:-DevAdmin!2026}
      DEV_MEDIA_PASSWORD: ${DEV_MEDIA_PASSWORD:-DevMedia!2026}
      DEV_UNIT_MANAGER_PASSWORD: ${DEV_UNIT_MANAGER_PASSWORD:-DevUnitManager!2026}
      DEV_PARENT_PASSWORD: ${DEV_PARENT_PASSWORD:-DevParent!2026}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "/app/entrypoint.sh"]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/', timeout=5)\""]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: besat_frontend
    restart: unless-stopped
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_BASE_URL: /api/backend
      NEXT_SERVER_API_BASE_URL: http://backend:8000/api
      BESAT_BACKEND_API_URL: http://backend:8000/api
      BESAT_ANON_THROTTLE_SECRET: ${BESAT_ANON_THROTTLE_SECRET:-local-anonymous-throttle-secret}
      WATCHPACK_POLLING: "true"
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next
    depends_on:
      backend:
        condition: service_healthy
    command: ["npm", "run", "dev"]

volumes:
  postgres_data:
  frontend_node_modules:
  frontend_next:
